name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The write token goes only to the gh steps, never to npm install scripts (neither as env nor in .git/config).
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # A merge without a version bump rebuilds the .vsix and replaces it on the existing release.
      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "V=$V" >> "$GITHUB_ENV"
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Read changelog section
        run: |
          awk -v h="## $V" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no '## $V' section"; exit 1; }

      - run: npm run package

      - name: Create GitHub release with the .vsix
        if: ${{ !steps.check.outputs.exists }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$V" "output/local-autocomplete-$V.vsix" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md

      - name: Replace the .vsix on the existing release
        if: steps.check.outputs.exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$V" "output/local-autocomplete-$V.vsix" --clobber
          gh release edit "v$V" --notes-file notes.md
